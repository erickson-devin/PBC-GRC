# ==============================================================================
# Event Horizon: Singularity — Air-Gapped & On-Premises Orchestration
# On-prem only: there is no cloud deployment.
# Services: PostgreSQL 16 Database + Singularity Enclave App & API + Ollama AI (optional profile)
#
# Required secrets (put them in a .env file next to this file, or export them):
#   POSTGRES_PASSWORD   password of the database ADMIN account (used only to bootstrap; the app never uses it)
#   APP_DB_PASSWORD     password of the application's database role
#   LOCAL_AUTH_SECRET   >= 32 random characters used to sign sessions (e.g. `openssl rand -hex 32`)
#
# Multi-factor authentication (TOTP) is ON by default for every local account (MFA_REQUIRED=all). To stage the rollout set
# MFA_REQUIRED=privileged first (platform administrators, tenant owners, MSP administrators), then remove it or set `all`.
# MFA_ENCRYPTION_KEY (optional, >= 32 random characters) keeps the enrolled factors independent of LOCAL_AUTH_SECRET.
# See docs/ON_PREM_DATABASE.md "Multi-factor authentication".
#
# Optional:
#   IMAGE_TAG              the release to run, e.g. v1.0.0 (default: the release this file ships with). Never latest. For an
#                          immutable pin use v1.0.0@sha256:<digest> (docs/ON_PREM_DATABASE.md "Releases").
#   PLATFORM_ADMIN_EMAILS  comma-separated e-mail addresses of the platform administrators of this installation. Only they can
#                          provision tenants for a specific assessment program (which frameworks a tenant may use) and see the
#                          administration console. Setting it also closes the first-time setup wizard (see below).
#   SETUP_TOKEN            a secret the first-time setup wizard asks for. Open the app in a browser to create the first
#                          administrator and tenant; the wizard locks itself for good once used. Set a token if the server is
#                          reachable by others before you have run it.
#   COMPOSE_PROFILES=ai    also run the local Ollama server (needs an NVIDIA GPU and the NVIDIA Container Toolkit), used for
#                          the AI analysis of imported System Security Plans (docs/SSP_IMPORT.md). Put it in .env, or run
#                          `docker compose --profile ai up -d`. Without it the platform starts without Ollama (it is not a
#                          dependency, so a host with no GPU still comes up) and imports use rule-based matching.
#                          Load the model once:  docker compose exec ollama ollama pull llama3.2:3b
#                          (needs internet once; for an air-gapped host copy the model volume or `ollama create` from a GGUF).
#   OLLAMA_MODEL / OLLAMA_NUM_CTX / OLLAMA_IMAGE_TAG   model (default llama3.2:3b, the model the CMMC import is tuned for), context window (8192), Ollama image
#                          (default: the release pinned below by digest; set `X.Y.Z` or `X.Y.Z@sha256:<digest>` to change it, never latest).
#   SSP_AI_ENABLED=false   switch the AI analysis off even if Ollama is running.
#
# Security model: the app connects as APP_DB_USER, an ordinary role (NOSUPERUSER, NOBYPASSRLS). PostgreSQL
# superusers bypass row-level security, so using POSTGRES_USER here would silently disable tenant isolation.
# The init script only runs when the data volume is first created; for an existing volume see docs/ON_PREM_DATABASE.md.
# ==============================================================================

services:
  # ── 1. PostgreSQL 16 Relational Storage with RLS Support ───────────────────
  singularity-db:
    # pinned by digest, resolved 2026-10-30; refresh in a reviewed PR
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: singularity-db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      # Admin account: bootstraps the database and the application role. Not used by the application.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (database admin password)}
      POSTGRES_DB: ${POSTGRES_DB:-cmmc_compliance_db}
      # Consumed by docker/postgres/10-app-role.sh
      APP_DB_USER: ${APP_DB_USER:-grc_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD (application database role password)}
    ports:
      # Bound to localhost: the database should not be reachable from the network
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Database files: a named volume by default; Unraid sets DB_DATA_DIR=/mnt/cache/appdata/singularity/postgres (a host directory)
      - ${DB_DATA_DIR:-postgres_data}:/var/lib/postgresql/data
      # Unraid sets INITDB_DIR=/mnt/user/appdata/singularity/docker/postgres; elsewhere the repository copy is used
      - ${INITDB_DIR:-./docker/postgres}:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d${POSTGRES_DB:-cmmc_compliance_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - singularity-network

  # ── 2. Event Horizon: Singularity Application & Local Storage API ──────────
  singularity-app:
    image: ghcr.io/erickson-devin/pbc-grc:${IMAGE_TAG:-v1.0.0}
    container_name: singularity-app
    restart: unless-stopped
    # A tiny init as PID 1: it forwards SIGTERM to the server (server/shutdown.ts) and reaps the SSP extraction children.
    init: true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Ollama is deliberately NOT listed here: the platform must start (and fall back to rule-based matching) without it.
    depends_on:
      singularity-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Local On-Premises / Air-Gapped Storage Driver
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /app/data/evidence
      # Database: PostgreSQL only (DB_MODE=memory is refused in production). Connects as the NON-superuser app role.
      DB_HOST: singularity-db
      DB_PORT: 5432
      DB_USER: ${APP_DB_USER:-grc_app}
      DB_PASS: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD (application database role password)}
      DB_NAME: ${POSTGRES_DB:-cmmc_compliance_db}
      # Air-gapped identity: bcrypt passwords + locally signed JWTs (local is the only mode).
      AUTH_MODE: local
      # Listen address inside the container. 0.0.0.0 (all interfaces) keeps the Unraid WebUI reachable on the LAN;
      # see docs/ON_PREM_DATABASE.md "Network exposure" for restricting access. APP_PORT is deliberately NOT passed in:
      # the container always listens on 3000 and APP_PORT only chooses the published host port (see ports below).
      APP_BIND_ADDRESS: ${APP_BIND_ADDRESS:-0.0.0.0}
      # Test-only; refused in production
      ALLOW_DEV_MOCK_TOKENS: ${ALLOW_DEV_MOCK_TOKENS:-}
      LOCAL_AUTH_SECRET: ${LOCAL_AUTH_SECRET:?Set LOCAL_AUTH_SECRET (>= 32 random characters)}
      # who must use a TOTP second factor: all (default when empty) | privileged | off
      MFA_REQUIRED: ${MFA_REQUIRED:-}
      # optional key (>= 32 characters) for the stored TOTP secrets; empty = derived from LOCAL_AUTH_SECRET
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      # Platform administrators and the first-time setup wizard (see the notes at the top of this file)
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Client-side configuration
      VITE_API_URL: ""
      # Local AI analysis of imported SSPs. If Ollama is not running the import screen says so and rule-based matching is used.
      SSP_AI_ENABLED: ${SSP_AI_ENABLED:-true}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      # Tuning for small models (docs/SSP_IMPORT.md); empty means the built-in default
      SSP_AI_MAX_CANDIDATES: ${SSP_AI_MAX_CANDIDATES:-}
      SSP_AI_RETRIEVAL_MIN_SCORE: ${SSP_AI_RETRIEVAL_MIN_SCORE:-}
      SSP_AI_MIN_CONFIDENCE: ${SSP_AI_MIN_CONFIDENCE:-}
      SSP_AI_GAP_MODE: ${SSP_AI_GAP_MODE:-}
      # Vulnerability management ingest (docs/VULNERABILITY_MANAGEMENT.md); empty means the built-in default. Compose passes no env_file, so list each one.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # true: plain-HTTP requests are refused (403 tls_required on /api, 301 to https:// for pages). Needs TRUST_PROXY. It answers before the VM routes' own vm_insecure_transport check, so REQUIRE_TLS wins.
      REQUIRE_TLS: ${REQUIRE_TLS:-}
      VM_ALLOW_INSECURE_TOKENS: ${VM_ALLOW_INSECURE_TOKENS:-}
      VM_INGEST_MAX_BYTES: ${VM_INGEST_MAX_BYTES:-}
      VM_SLA_DAYS_CRITICAL: ${VM_SLA_DAYS_CRITICAL:-}
      VM_SLA_DAYS_HIGH: ${VM_SLA_DAYS_HIGH:-}
      VM_SLA_DAYS_MEDIUM: ${VM_SLA_DAYS_MEDIUM:-}
      VM_SLA_DAYS_LOW: ${VM_SLA_DAYS_LOW:-}
      VM_POAM_AUTOCREATE: ${VM_POAM_AUTOCREATE:-}
      VM_SCHEDULER_TICK_MINUTES: ${VM_SCHEDULER_TICK_MINUTES:-}
      VM_SNAPSHOT_INTERVAL_HOURS: ${VM_SNAPSHOT_INTERVAL_HOURS:-}
      VM_COVERAGE_THRESHOLD: ${VM_COVERAGE_THRESHOLD:-}
      ASSESSMENT_EVENT_RETENTION_DAYS: ${ASSESSMENT_EVENT_RETENTION_DAYS:-}
      # Sign-in, tenant creation, AI timeout and database TLS; empty means the built-in default
      ALLOW_TENANT_CREATION: ${ALLOW_TENANT_CREATION:-}
      LOCAL_AUTH_TOKEN_TTL_SECONDS: ${LOCAL_AUTH_TOKEN_TTL_SECONDS:-}
      PASSWORD_HISTORY_DEPTH: ${PASSWORD_HISTORY_DEPTH:-}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-}
      SSP_AI_MAX_SECTIONS: ${SSP_AI_MAX_SECTIONS:-}
      SSP_AI_GAP_ANALYSIS: ${SSP_AI_GAP_ANALYSIS:-}
      DB_SSL: ${DB_SSL:-}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-}
    ports:
      # All interfaces by default (Unraid WebUI on the LAN). Behind a TLS reverse proxy on this host set APP_PUBLISH_ADDRESS=127.0.0.1
      # (the container keeps APP_BIND_ADDRESS=0.0.0.0). The host port is APP_PORT, the container always listens on 3000
      - "${APP_PUBLISH_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:3000"
    volumes:
      # Persistent local evidence vault: the repository folder by default; Unraid sets EVIDENCE_DIR=/mnt/cache/appdata/singularity/evidence
      - ${EVIDENCE_DIR:-./data/evidence}:/app/data/evidence
    networks:
      - singularity-network

  # ── 3. Local Ollama Server (AI analysis with GPU): optional, enabled by the "ai" profile ──
  ollama:
    profiles: ["ai"]
    # pinned by digest, resolved 2026-10-30; refresh in a reviewed PR
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429}
    container_name: singularity-ollama
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      # Model store: a named volume by default; Unraid sets OLLAMA_MODELS_DIR=/mnt/user/appdata/singularity/ollama-models
      - ${OLLAMA_MODELS_DIR:-ollama-models}:/root/.ollama
    # No published port: only the app container (same network) can reach it
    networks:
      - singularity-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      OLLAMA_KEEP_ALIVE: 15m

volumes:
  postgres_data:
    driver: local
  ollama-models:

networks:
  singularity-network:
    driver: bridge
    # A fixed subnet makes the bridge gateway address stable: a TLS proxy on this host reaches the app from 172.30.0.1,
    # so TRUST_PROXY=172.30.0.1 stays correct. Change both together if this range collides with your network.
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
