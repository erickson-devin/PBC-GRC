name: Build and Publish Docker Image

# The image is published ONLY from a push to main (that is, a merged pull request). Pull requests never reach this
# workflow: they run ci.yml, which only tests. There is deliberately no tag or manual trigger, so no other branch or
# ref can publish an image.
on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  # The same checks as on the pull request, run again on the merged commit before anything is published
  test:
    uses: ./.github/workflows/ci.yml

  build-and-push-image:
    needs: test
    # Belt and braces: even if the triggers above are edited later, only main may publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Lowercase the repository name to satisfy Docker registry specifications
      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # Set up Docker Buildx for BuildKit features and layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate metadata, tags, and labels
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      # Build and push Docker image with GitHub Actions layer caching
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
