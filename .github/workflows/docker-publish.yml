name: Build and Publish Docker Image

# The image is published ONLY from a push to main (a merged pull request: tags sha-<commit> and latest, for testing) or from a
# SemVer release tag vX.Y.Z on a commit already on main (tags vX.Y.Z, vX.Y and vX). Pull requests never reach this workflow:
# they run ci.yml, which only tests. There is deliberately no manual trigger and no other tag pattern.
on:
  push:
    branches: [ "main" ]
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]

env:
  REGISTRY: ghcr.io

jobs:
  # The same checks as on the pull request, run again on the merged commit before anything is published
  test:
    uses: ./.github/workflows/ci.yml

  build-and-push-image:
    needs: test
    # Belt and braces: even if the triggers above are edited later, only main or a release tag may publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # A throwaway database for the smoke test: the built image is started against it before anything is pushed (#156)
    services:
      postgres:
        # the same image and digest as docker-compose.yml (tests/onPremOnly.test.ts checks they match)
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-throwaway-admin
          POSTGRES_DB: cmmc_compliance_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cmmc_compliance_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_DB_USER: grc_app
      APP_DB_PASSWORD: ci-throwaway-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The commit actually built (a tag push checks out the tagged commit)
      - name: Resolve the build commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A release tag must name a commit already on main and match package.json "version" (what /api/v1/health reports)
      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(jq -r .version package.json)"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($expected)"; exit 1; fi
          if ! git merge-base --is-ancestor HEAD origin/main; then echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; fi

      # Lowercase the repository name to satisfy Docker registry specifications
      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # Set up Docker Buildx for BuildKit features and layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate metadata, tags, and labels
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest only from the explicit rule below (the default latest=auto would also move it on a release tag)
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      # Build once into the local Docker engine (nothing is pushed) so the image can be started before it is published (#156)
      - name: Build the image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: pbc-grc-smoke:${{ steps.commit.outputs.sha }}
          build-args: BUILD_COMMIT=${{ steps.commit.outputs.sha }}
          cache-from: type=gha

      - name: Create the application role
        run: |
          docker cp docker/postgres/10-app-role.sh "${{ job.services.postgres.id }}:/tmp/10-app-role.sh"
          docker exec -e APP_DB_USER -e APP_DB_PASSWORD "${{ job.services.postgres.id }}" sh /tmp/10-app-role.sh

      # Start the built image against the throwaway database; the push below runs only if this passes
      - name: Smoke test the image
        id: smoke
        shell: bash
        env:
          SMOKE_IMAGE: pbc-grc-smoke:${{ steps.commit.outputs.sha }}
          EXPECTED_COMMIT: ${{ steps.commit.outputs.sha }}
          DB_USER: grc_app
          DB_PASS: ci-throwaway-app
        run: |
          LOCAL_AUTH_SECRET="$(openssl rand -hex 32)"; echo "::add-mask::$LOCAL_AUTH_SECRET"; export LOCAL_AUTH_SECRET
          docker run -d --name pbc-smoke --network host \
            -e NODE_ENV=production -e AUTH_MODE=local -e APP_BIND_ADDRESS=127.0.0.1 -e LOCAL_AUTH_SECRET \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 -e DB_NAME=cmmc_compliance_db -e DB_USER -e DB_PASS \
            -e SSP_AI_ENABLED=false \
            --tmpfs /app/data/evidence:rw,mode=0700,uid=1000,gid=1000 \
            "$SMOKE_IMAGE"
          version="$(jq -r .version package.json)"
          deadline=$((SECONDS + 90))
          until body="$(curl -fsS http://127.0.0.1:3000/api/v1/health 2>/dev/null)" && \
                echo "$body" | jq -e --arg c "$EXPECTED_COMMIT" --arg v "$version" \
                  '.status == "healthy" and .database == "connected" and .buildCommit == $c and .version == $v' >/dev/null; do
            if [ "$(docker inspect -f '{{.State.Running}}' pbc-smoke)" != "true" ]; then echo "::error::the container exited"; docker logs pbc-smoke; exit 1; fi
            if [ "$SECONDS" -ge "$deadline" ]; then echo "::error::health not 200 connected within 90 s"; docker logs pbc-smoke; exit 1; fi
            sleep 2
          done
          if docker logs pbc-smoke 2>&1 | grep -F '[FATAL]'; then echo "::error::[FATAL] in the container log"; exit 1; fi
          docker logs pbc-smoke 2>&1 | grep -qF '[PostgreSQL] Database schema, control mappings, and RLS policies verified.'
          docker exec pbc-smoke npm run db:verify-rls
          docker rm -f pbc-smoke

      # Build and push Docker image with GitHub Actions layer caching
      - name: Build and push Docker image
        id: build
        if: steps.smoke.outcome == 'success'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_COMMIT=${{ steps.commit.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest operators pin (docs/ON_PREM_DATABASE.md "Releases")
      - name: Record the image digest
        run: |
          {
            echo "### Published image"
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "Tags:"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
