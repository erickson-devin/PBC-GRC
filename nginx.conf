# Event Horizon: Singularity: reverse proxy for an on-premises install.
#
# Serves the built single-page application (the contents of dist/, mounted at /usr/share/nginx/html) and forwards /api/ to
# the Node API. There is no public site: every other path is the SPA, which sends "/" and unknown paths to the login page
# (or the app when signed in).
#
# `singularity-app:3000` is the app container of docker-compose.yml: change it if the API runs elsewhere.
upstream singularity_api {
    server singularity-app:3000;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Evidence uploads are proxied to the API, which accepts up to 100 MB per file
    client_max_body_size 100m;

    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security headers for CMMC / NIST compliance
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; frame-src 'none'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # The API
    location ^~ /api/ {
        proxy_pass http://singularity_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The app shell is never cached, so a new release is picked up straight away
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build assets can be cached for a year
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page application: every other path is handled by the app's router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
