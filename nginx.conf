# PBC-GRC (Event Horizon: Singularity): TLS reverse proxy for an on-premises install.
# Install as /etc/nginx/conf.d/pbc-grc.conf (included inside the distribution's http {} block).
# Needs nginx >= 1.25.1 (http2 on) built against OpenSSL >= 1.1.1 (ssl_conf_command, ssl_reject_handshake).
# The app serves BOTH the single-page application (dist/) and /api/ on 127.0.0.1:3000; this proxy only terminates TLS,
# adds HSTS and forwards. App side: APP_PUBLISH_ADDRESS=127.0.0.1 (compose) or APP_BIND_ADDRESS=127.0.0.1 (source install),
# and TRUST_PROXY = this proxy's address as the app sees it ("loopback" for a source install; the Docker bridge gateway
# address, 172.30.0.1 with the compose file's default subnet, for compose). The app sets X-Content-Type-Options,
# X-Frame-Options, Referrer-Policy, Content-Security-Policy and Cache-Control itself. See docs/GO_LIVE_CHECKLIST.md.

server_tokens off;

# No query strings and no Referer in the access log: an invitation link carries its secret in the URL
log_format pbc_grc '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent $request_time "$http_user_agent"';

upstream pbc_grc_app {
    server 127.0.0.1:3000;
}

# Plain HTTP only redirects
server {
    listen 80;
    listen [::]:80;
    server_name grc.example.mil;
    access_log /var/log/nginx/pbc-grc.access.log pbc_grc;
    return 301 https://$host$request_uri;
}

# Any other host name: refuse the TLS handshake
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grc.example.mil;

    ssl_certificate     /etc/nginx/tls/grc.example.mil.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/grc.example.mil.key;
    # TLS 1.3 only: every supported browser and the exporter (Python 3.11, OpenSSL 3) negotiate it, and its cipher suites
    # are all AEAD (AES-GCM, ChaCha20-Poly1305). Add TLSv1.2 on the next line only for a client that cannot do 1.3.
    ssl_protocols TLSv1.3;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    # FIPS-approved suites only (real FIPS mode also needs a validated OpenSSL on this host)
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;
    ssl_ecdh_curve prime256v1:secp384r1;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:pbc_grc_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/pbc-grc.access.log pbc_grc;
    error_log  /var/log/nginx/pbc-grc.error.log warn;

    # HSTS is the proxy's job. Keep EVERY add_header at this level: an add_header inside a location drops these there.
    # No includeSubDomains / preload unless every host under the domain is HTTPS (see the checklist).
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_hide_header X-Powered-By;

    # Everything except the API: small bodies
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: never pass on what the client claimed
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host "";            # an empty value strips the header
    proxy_set_header Forwarded "";
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_max_temp_file_size 0;                      # never spool responses (evidence, SSP documents) to this host's disk

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    # HTML is always compressed; JSON is NOT (API bodies carry one-time secrets: BREACH)
    gzip_types text/css application/javascript image/svg+xml;

    location ^~ /api/ {
        proxy_pass http://pbc_grc_app;
        # Evidence upload 100 MB (express.raw '100mb'), VM ingest at most 100 MB, SSP upload 50 MB, JSON 15 MB
        client_max_body_size 100m;
        # Stream uploads to the app: CUI is not written to client_body_temp_path
        proxy_request_buffering off;
        # The AI wording helper waits for the model up to OLLAMA_TIMEOUT_MS (240 s default); SSP import is async (polling)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://pbc_grc_app;
    }
}
