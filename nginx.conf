server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers for CMMC / NIST compliance
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https: blob:; frame-src 'self' https://*.firebaseapp.com https://login.microsoftonline.com https://accounts.google.com; connect-src 'self' https://storage.googleapis.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://login.microsoftonline.com https://accounts.google.com;" always;

    # Clean URLs for Legal Documents (Google OAuth Verification & External Audits)
    location = /privacy {
        try_files /privacy.html /index.html;
    }

    location = /terms {
        try_files /terms.html /index.html;
    }

    # SPA Routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
