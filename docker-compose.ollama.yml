# Optional: a local Ollama server (with GPU) for the AI analysis of imported System Security Plans.
#
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
#   docker compose exec ollama ollama pull llama3.1:8b        # needs internet once; see "Air-gapped" below
#
# The platform works without this file: imports then use rule-based matching only. Nothing here changes the database or the
# network of docker-compose.yml; it adds one service on the same network and tells the app where to find it.
#
# Requirements: an NVIDIA GPU, the NVIDIA driver, and the NVIDIA Container Toolkit on the host
# (https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/).
#
# Ollama already running directly on the host instead? Skip this file and set, in the app's environment:
#   SSP_AI_ENABLED=true   OLLAMA_BASE_URL=http://host.docker.internal:11434
# (on Linux also add `extra_hosts: ["host.docker.internal:host-gateway"]` to the app service).
#
# Air-gapped: load the model on a connected machine (`ollama pull`), copy the volume or the ~/.ollama/models directory over,
# or use `ollama create` from a GGUF file. This install never downloads a model by itself.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: singularity-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # No published port: only the app container (same network) can reach it
    networks:
      - singularity-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      OLLAMA_KEEP_ALIVE: 15m

  singularity-app:
    environment:
      SSP_AI_ENABLED: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
    depends_on:
      - ollama

volumes:
  ollama-models:
